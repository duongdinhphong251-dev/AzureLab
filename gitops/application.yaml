apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azurelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/duongdinhphong251-dev/AzureLab.git
    targetRevision: main
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: azurelab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
