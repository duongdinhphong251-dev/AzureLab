apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: azurelab
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: 'true'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: acrazurelabb436d920.azurecr.io/azurelab-backend:0c0b974d92d4
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 10
        env:
        - name: APP_ENV
          value: azure
        - name: DATABASE_URL_FILE
          value: /mnt/secrets-store/database-url
        - name: AZURE_STORAGE_ACCOUNT_URL
          value: https://stazurelabb436d920.blob.core.windows.net
        - name: AZURE_STORAGE_CONTAINER
          value: product-images
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: secrets
          mountPath: /mnt/secrets-store
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: backend-keyvault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: backend
            topologyKey: kubernetes.io/hostname
      serviceAccountName: backend
